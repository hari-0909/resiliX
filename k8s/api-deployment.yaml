apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: api-service:v5
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        securityContext:
          capabilities:
            add:
              - NET_ADMIN